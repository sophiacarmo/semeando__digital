
<!-- socio.html -->
<h1 class="page-title">Inclusão de Sócio Contribuinte</h1>
<p class="page-subtitle">Gestão de associados vinculados à Educação Infantil do Instituto Educacional Semeando.</p>
<form class="content-panel" onsubmit="event.preventDefault(); alert('Ficha de Sócio salva com sucesso!');">
    <div class="panel-header">Ficha Cadastral de Associação</div>
    <div class="form-grid">
        <div class="col-6"><label>Nome Completo do Associado</label><input type="text" required></div>
        <div class="col-3"><label>CPF</label><input type="text" placeholder="000.000.000-00" required></div>
        <div class="col-3"><label>Data de Nascimento</label><input type="date" required></div>
        <div class="col-4">
            <label>Modalidade de Sócio</label>
            <select required>
                <option value="Efetivo">Sócio Efetivo</option>
                <option value="Fundador">Sócio Fundador</option>
                <option value="Mantenedor">Sócio Mantenedor (C I - Contribuinte)</option>
                <option value="Apoiador">Sócio Apoiador (C II)</option>
            </select>
        </div>
        <div class="col-4"><label>Taxa de Associação Fixada (Anual)</label><input type="text" value="R$ 125,00" disabled style="background-color: #eceff1; font-weight: 600;"></div>
        <div class="col-4"><label>Data de Ingresso</label><input type="date" required></div>
        <div class="col-12"><label>Endereço Residencial Unificado Corporativo</label><input type="text" value="Avenida Alphaville, nº 25, Bairro Pontal da Ilha, São Luís - MA" disabled style="background-color: #f5f5f5; color: #555;"></div>
            </div>
    <div style="margin-top: 24px; text-align: right;"><button type="submit" class="btn"><i class="fa-solid fa-floppy-disk"></i> Validar e Salvar Associação</button></div>
</form>
